      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script>
      // Runs before first paint so the page never flashes the wrong theme.
      // 1. Drop the no-js flag (lets CSS skip work for no-JS visitors).
      // 2. Pick a theme: saved choice first, Golden Hour otherwise.
      ;(function () {
        var root = document.documentElement
        root.classList.remove('no-js')
        // Phones / touch / narrow windows get the lightweight version.
        // Keep this query in sync with LITE_QUERY in src/lib/device.js.
        try {
          root.dataset.perf = window.matchMedia('(max-width: 900px), (hover: none), (pointer: coarse)').matches ? 'lite' : 'full'
        } catch (error) {
          root.dataset.perf = 'full'
        }
        try {
          var saved = window.localStorage.getItem('portfolio-theme')
          root.dataset.theme = saved === 'light' || saved === 'dark' ? saved : 'light'
          var meta = document.getElementById('theme-color')
          if (meta) meta.content = root.dataset.theme === 'dark' ? '#141a3a' : '#fff6ea'
        } catch (error) {
          root.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
